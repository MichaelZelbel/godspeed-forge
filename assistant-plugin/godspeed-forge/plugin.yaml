name: godspeed-forge
version: "0.2.1"
description: >-
  Shows the model what the Forge waits for from the owner (a version ready to try, a question),
  once per turn, before it reads the message (pre_llm_call), so a bare "go" or "F1 2" reaches the
  Forge although the Forge sent its message straight to the owner. Prints nothing when nothing
  waits. Installed by the Forge's install line.
author: godspeed-forge
kind: standalone
